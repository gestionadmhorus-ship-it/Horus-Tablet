name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Prepare OTA Package
      run: |
        mkdir -p ota-dist
        cd dist
        zip -r ../ota-dist/bundle.zip ./*
        cd ..
        VERSION_TAG="v2.0.${{ github.run_number }}"
        echo "{\"version\": \"$VERSION_TAG\", \"url\": \"https://raw.githubusercontent.com/${{ github.repository }}/ota-updates/bundle.zip\"}" > ota-dist/version.json

    - name: Deploy OTA to GitHub Branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: ota-updates
        publish_dir: ./ota-dist
        commit_message: "Actualización OTA $VERSION_TAG"

    - name: Deploy Web App to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./dist
        commit_message: "Actualización Web App $VERSION_TAG"

    - name: Prepare Cordova Plugins Directory
      run: |
        mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
        cat > android/capacitor-cordova-android-plugins/cordova.variables.gradle << 'EOF'
        // This file is automatically generated by Capacitor sync
        ext {
        }
        EOF
        cat > android/capacitor-cordova-android-plugins/build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.7.3'
            }
        }

        apply plugin: 'com.android.library'

        android {
            namespace "capacitor.cordova.android.plugins"
            compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
            defaultConfig {
                minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
                targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
            }
            sourceSets {
                main {
                    java.srcDirs = ['src/main/java']
                    res.srcDirs = ['src/main/res']
                }
            }
        }

        repositories {
            google()
            mavenCentral()
            flatDir {
                dirs 'src/main/libs'
            }
        }
        EOF
        mkdir -p android/capacitor-cordova-android-plugins/src/main/java
        touch android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build APK
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hermes-ii-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Generate Direct Download Link
      run: |
        RESPONSE=$(curl -s -F "file=@android/app/build/outputs/apk/debug/app-debug.apk" https://file.io/?expires=1w)
        DOWNLOAD_URL=$(echo $RESPONSE | grep -o '"link":"[^"]*' | cut -d'"' -f4)
        echo "## 📥 Enlace de Descarga Directa" >> $GITHUB_STEP_SUMMARY
        echo "Copia y pega el siguiente enlace en el navegador de tu tablet para descargar el APK directamente sin usar la interfaz de GitHub:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### $DOWNLOAD_URL" >> $GITHUB_STEP_SUMMARY
